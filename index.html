<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111418">
<title>Lift — Workout Tracker</title>
<style>
  :root{
    --bg:#111418; --card:#1b2027; --card2:#232a33; --line:#2c343f;
    --text:#eef2f6; --muted:#8b98a5; --accent:#3f8ef7; --accent-dim:#1d3a5f;
    --green:#2ecc71; --red:#e74c3c; --amber:#f5b942;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; overscroll-behavior:none;
  }
  #app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header{
    position:sticky; top:0; z-index:20; background:rgba(17,20,24,.92);
    backdrop-filter:blur(8px); padding:14px 16px 10px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{font-size:19px; font-weight:700; letter-spacing:.2px;}
  header .sub{font-size:12px; color:var(--muted); margin-top:2px;}

  main{flex:1; padding:14px 14px 90px;}

  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(20,24,29,.97); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:6px 0 max(8px, env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  nav button{
    background:none; border:none; color:var(--muted); font-size:11px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:4px 14px; cursor:pointer; font-family:inherit;
  }
  nav button svg{width:22px; height:22px; stroke:currentColor;}
  nav button.on{color:var(--accent);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
    width:100%;
  }
  .btn.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line);}
  .btn.small{width:auto; padding:8px 12px; font-size:13px; border-radius:8px;}
  .btn.danger{background:transparent; color:var(--red); border:1px solid var(--line);}
  .btn.green{background:var(--green); color:#0b2416;}
  .btn:active{opacity:.8;}

  .row{display:flex; align-items:center; gap:10px;}
  .grow{flex:1;}
  .muted{color:var(--muted);}
  .sm{font-size:12px;}
  .xs{font-size:11px;}
  .bold{font-weight:700;}
  .mt8{margin-top:8px;} .mt12{margin-top:12px;}
  .center{text-align:center;}

  h2.section{font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:18px 2px 10px;}

  input[type=text], input[type=number], input[type=search], select{
    background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:15px; width:100%; font-family:inherit;
    outline:none;
  }
  input:focus{border-color:var(--accent);}
  input[type=number]{-moz-appearance:textfield; text-align:center;}
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{-webkit-appearance:none;}

  /* set table */
  .set-head, .set-row{display:grid; grid-template-columns:36px 1fr 72px 72px 44px; gap:8px; align-items:center;}
  .set-head{margin-top:10px;}
  .set-row{margin-top:6px; border-radius:10px; padding:3px 2px;}
  .set-row.done{background:rgba(46,204,113,.18);}
  .set-row.done input{color:var(--green); font-weight:700;}
  .rt-head, .rt-row{display:grid; grid-template-columns:36px 1fr 1fr 44px; gap:8px; align-items:center; margin-top:6px;}
  .hdr{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; text-align:center;}
  .set-num{
    width:30px; height:30px; border-radius:8px; background:var(--card2); border:none;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--muted);
    margin:0 auto; cursor:pointer; font-family:inherit;
  }
  .set-num.warm{color:var(--amber);}
  .set-row.done .set-num{background:transparent;}
  .prev{font-size:12px; color:var(--muted); text-align:center; overflow:hidden; white-space:nowrap;}
  .chk{
    width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:var(--card2);
    color:var(--muted); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    margin:0 auto;
  }
  .set-row.done .chk{background:var(--green); border-color:var(--green); color:#0b2416;}
  .set-row input, .rt-row input{padding:8px 6px;}

  .ex-name{font-weight:700; font-size:16px; color:var(--accent);}
  .pill{
    display:inline-block; background:var(--card2); border:1px solid var(--line);
    border-radius:999px; padding:3px 10px; font-size:11px; color:var(--muted);
  }
  .pill.hot{background:var(--accent-dim); color:var(--accent); border-color:transparent;}

  /* list rows */
  .lrow{
    display:flex; align-items:center; gap:12px; padding:13px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .lrow:last-child{border-bottom:none;}
  .avatar{
    width:40px; height:40px; border-radius:10px; background:var(--card2);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:var(--accent);
    flex-shrink:0;
  }

  /* modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg); border-top-left-radius:20px; border-top-right-radius:20px;
    width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:18px 16px 30px;
    border:1px solid var(--line);
  }
  .modal h3{font-size:17px; margin-bottom:12px;}
  .grab{width:42px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 14px;}

  /* rest timer bar */
  #restBar{
    position:fixed; bottom:66px; left:0; right:0; z-index:25; max-width:520px; margin:0 auto;
    background:var(--accent-dim); border:1px solid var(--accent); border-radius:12px;
    padding:10px 14px; display:flex; align-items:center; gap:10px; margin-left:auto; margin-right:auto;
    width:calc(100% - 24px);
  }
  #restBar .time{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent);}
  #restBar button{background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer; font-family:inherit;}

  /* workout banner */
  #resumeBanner{
    background:var(--accent-dim); border:1px solid var(--accent); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:10px; cursor:pointer;
  }

  .stat3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:10px 0;}
  .stat3 .card{margin:0; padding:10px; text-align:center;}
  .stat3 .v{font-size:17px; font-weight:800;}
  .stat3 .k{font-size:11px; color:var(--muted); margin-top:2px;}

  .chart-wrap{background:var(--card2); border-radius:10px; padding:8px; margin-top:10px;}
  svg.chart{width:100%; height:120px; display:block;}

  .filters{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .filters .pill{white-space:nowrap; cursor:pointer;}
  .filters .pill.on{background:var(--accent); color:#fff; border-color:var(--accent);}

  .empty{color:var(--muted); text-align:center; padding:40px 20px; font-size:14px; line-height:1.6;}
  .empty .big{font-size:34px; display:block; margin-bottom:8px;}

  .prtag{font-size:10px; font-weight:800; color:var(--amber); margin-left:6px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="hTitle">Workout</h1>
      <div class="sub" id="hSub"></div>
    </div>
    <div id="hAction"></div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<script>
"use strict";
/* ============ storage ============ */
const DB_KEY = "lift.db.v1";
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString();

const SEED_EXERCISES = [
  ["Bench Press (Barbell)","Chest","Barbell"],["Incline Bench Press (Dumbbell)","Chest","Dumbbell"],
  ["Chest Fly (Cable)","Chest","Cable"],["Push Up","Chest","Bodyweight"],
  ["Overhead Press (Barbell)","Shoulders","Barbell"],["Shoulder Press (Dumbbell)","Shoulders","Dumbbell"],
  ["Lateral Raise (Dumbbell)","Shoulders","Dumbbell"],["Rear Delt Fly (Machine)","Shoulders","Machine"],
  ["Squat (Barbell)","Legs","Barbell"],["Front Squat (Barbell)","Legs","Barbell"],
  ["Leg Press","Legs","Machine"],["Romanian Deadlift (Barbell)","Legs","Barbell"],
  ["Leg Extension","Legs","Machine"],["Leg Curl (Lying)","Legs","Machine"],
  ["Lunge (Dumbbell)","Legs","Dumbbell"],["Calf Raise (Standing)","Legs","Machine"],
  ["Hip Thrust (Barbell)","Glutes","Barbell"],
  ["Deadlift (Barbell)","Back","Barbell"],["Pull Up","Back","Bodyweight"],
  ["Chin Up","Back","Bodyweight"],["Lat Pulldown (Cable)","Back","Cable"],
  ["Bent Over Row (Barbell)","Back","Barbell"],["Seated Row (Cable)","Back","Cable"],
  ["Dumbbell Row","Back","Dumbbell"],
  ["Bicep Curl (Barbell)","Arms","Barbell"],["Bicep Curl (Dumbbell)","Arms","Dumbbell"],
  ["Hammer Curl (Dumbbell)","Arms","Dumbbell"],["Preacher Curl (Machine)","Arms","Machine"],
  ["Triceps Pushdown (Cable)","Arms","Cable"],["Skullcrusher (Barbell)","Arms","Barbell"],
  ["Dip","Arms","Bodyweight"],
  ["Plank","Core","Bodyweight"],["Crunch (Cable)","Core","Cable"],
  ["Hanging Leg Raise","Core","Bodyweight"],["Russian Twist","Core","Bodyweight"],
  ["Face Pull (Cable)","Shoulders","Cable"],["Shrug (Dumbbell)","Back","Dumbbell"],
  ["Goblet Squat (Dumbbell)","Legs","Dumbbell"],["Arnold Press (Dumbbell)","Shoulders","Dumbbell"],
];

function freshDB(){
  return {
    exercises: SEED_EXERCISES.map(([name,muscle,equipment]) => ({id:uid(), name, muscle, equipment, custom:false})),
    routines: [],
    folders: [],            // routine folders
    workouts: [],           // completed, newest first
    active: null,           // in-progress workout
    settings: {restSec: 90},
  };
}
let db;
try {
  db = JSON.parse(localStorage.getItem(DB_KEY)) || freshDB();
} catch(e){ db = freshDB(); }
/* migrations: folders, per-set routine templates, set types */
db.folders = db.folders || [];
for (const r of db.routines){
  if (r.folderId === undefined) r.folderId = null;
  r.items = r.items.map(it => Array.isArray(it.sets) ? it :
    ({exId: it.exId, sets: Array.from({length: it.sets || 3}, () => ({type:"N", weight:null, reps:null}))}));
}
const ensureType = s => { if (!s.type) s.type = "N"; };
for (const w of db.workouts) for (const ex of w.exercises) ex.sets.forEach(ensureType);
if (db.active) for (const ex of db.active.exercises) ex.sets.forEach(ensureType);
const save = () => localStorage.setItem(DB_KEY, JSON.stringify(db));
save();

const exById = id => db.exercises.find(e => e.id === id);

/* ============ helpers ============ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kg = n => (Math.round(n*10)/10).toLocaleString();
function fmtDur(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? `${h}h ${m}m` : `${m}m ${s%60}s`;
}
function fmtClock(ms){
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600), m = String(Math.floor((s%3600)/60)).padStart(2,"0"), ss = String(s%60).padStart(2,"0");
  return h ? `${h}:${m}:${ss}` : `${m}:${ss}`;
}
function fmtDate(iso){
  const d = new Date(iso);
  const diff = (Date.now() - d) / 864e5;
  if (d.toDateString() === new Date().toDateString()) return "Today";
  if (diff < 2 && new Date(Date.now()-864e5).toDateString() === d.toDateString()) return "Yesterday";
  return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
}
const epley = (w, r) => r > 1 ? w * (1 + r/30) : w;
/* warmup (type "W") sets are excluded from volume, set counts, and PRs */
function workoutVolume(w){
  return w.exercises.reduce((t,ex) => t + ex.sets.reduce((s,set) => s + (set.done && set.type!=="W" ? (set.weight||0)*(set.reps||0) : 0), 0), 0);
}
function doneSets(w){
  return w.exercises.reduce((t,ex) => t + ex.sets.filter(s=>s.done && s.type!=="W").length, 0);
}
/* best (weight, then est 1RM) done set per exercise across all history */
function bestSetFor(exId, beforeIso){
  let best = null;
  for (const w of db.workouts){
    if (beforeIso && w.endedAt >= beforeIso) continue;
    for (const ex of w.exercises){
      if (ex.exId !== exId) continue;
      for (const s of ex.sets){
        if (!s.done || !s.weight || s.type==="W") continue;
        if (!best || epley(s.weight, s.reps) > epley(best.weight, best.reps)) best = s;
      }
    }
  }
  return best;
}
/* last performed sets for an exercise (for "previous" ghosts) */
function lastSetsFor(exId){
  for (const w of db.workouts){
    for (const ex of w.exercises){
      if (ex.exId === exId){
        const done = ex.sets.filter(s => s.done);
        if (done.length) return done;
      }
    }
  }
  return [];
}

/* ============ rendering core ============ */
let tab = "workout";
let exFilter = "All";
let exSearch = "";
const $ = sel => document.querySelector(sel);
const main = $("#main");

const TABS = [
  ["workout","Workout",'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11" stroke-linecap="round"/></svg>'],
  ["routines","Routines",'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5" stroke-linecap="round"/></svg>'],
  ["history","History",'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/></svg>'],
  ["exercises","Exercises",'<svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 19V5M4 15c4-6 12 2 16-4" stroke-linecap="round"/></svg>'],
];
function renderNav(){
  $("#nav").innerHTML = TABS.map(([id,label,icon]) =>
    `<button class="${tab===id?'on':''}" onclick="go('${id}')">${icon}${label}</button>`).join("");
}
function go(t){ tab = t; render(); window.scrollTo(0,0); }

function setHeader(title, sub, actionHtml){
  $("#hTitle").textContent = title;
  $("#hSub").textContent = sub || "";
  $("#hAction").innerHTML = actionHtml || "";
}

function render(){
  renderNav();
  closeModal();
  if (tab === "workout")   renderWorkoutTab();
  if (tab === "routines")  renderRoutines();
  if (tab === "history")   renderHistory();
  if (tab === "exercises") renderExercises();
}

/* ============ WORKOUT TAB ============ */
let tickHandle = null;

function renderWorkoutTab(){
  clearInterval(tickHandle);
  if (db.active) return renderActiveWorkout();

  const week = db.workouts.filter(w => Date.now() - new Date(w.endedAt) < 7*864e5).length;
  setHeader("Workout", week ? `${week} workout${week>1?"s":""} this week` : "Ready to train");

  let html = `<button class="btn" onclick="startEmpty()">+ Start Empty Workout</button>`;

  if (db.routines.length){
    html += `<h2 class="section">My Routines</h2>`;
    html += db.routines.map(r => {
      const exNames = r.items.map(i => exById(i.exId)?.name).filter(Boolean);
      return `<div class="card">
        <div class="row">
          <div class="grow">
            <div class="bold">${esc(r.name)}</div>
            <div class="sm muted mt8">${esc(exNames.slice(0,4).join(", "))}${exNames.length>4?` +${exNames.length-4} more`:""}</div>
          </div>
        </div>
        <div class="row mt12">
          <button class="btn small grow" onclick="startRoutine('${r.id}')">Start Routine</button>
          <button class="btn small ghost" onclick="editRoutine('${r.id}')">Edit</button>
        </div>
      </div>`;
    }).join("");
  } else {
    html += `<div class="empty"><span class="big">📋</span>No routines yet.<br>Build one in the Routines tab to start workouts faster.</div>`;
  }
  main.innerHTML = html;
}

function startEmpty(){
  db.active = {id:uid(), name:defaultName(), startedAt:todayISO(), exercises:[]};
  save(); render();
}
function defaultName(){
  const h = new Date().getHours();
  return (h<11?"Morning":h<17?"Afternoon":"Evening") + " Workout";
}
function startRoutine(rid){
  const r = db.routines.find(x=>x.id===rid); if(!r) return;
  db.active = {
    id:uid(), name:r.name, startedAt:todayISO(),
    exercises: r.items.map(i => makeWorkoutExercise(i.exId, i.sets)),
  };
  save(); render();
}
function makeWorkoutExercise(exId, tmpl){
  const prev = lastSetsFor(exId);
  if (tmpl && tmpl.length){
    return {exId, sets: tmpl.map((t,i) => ({
      type: t.type || "N", weight: t.weight ?? null, reps: t.reps ?? null, done:false,
      prevW: prev[i]?.weight ?? null, prevR: prev[i]?.reps ?? null,
    }))};
  }
  const n = Math.max(prev.length, 3);
  return {exId, sets: Array.from({length:n}, (_,i) => ({
    type: prev[i]?.type || "N", weight:null, reps:null, done:false,
    prevW: prev[i]?.weight ?? null, prevR: prev[i]?.reps ?? null,
  }))};
}

function renderActiveWorkout(){
  const a = db.active;
  setHeader(a.name, "", `<button class="btn small green" onclick="finishWorkout()">Finish</button>`);

  const vol = workoutVolume(a), sets = doneSets(a);
  let html = `
    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="xs muted">DURATION</div>
          <div class="bold" style="font-size:22px;font-variant-numeric:tabular-nums" id="liveClock">0:00</div>
        </div>
        <div class="center grow"><div class="xs muted">VOLUME</div><div class="bold" style="font-size:22px">${kg(vol)} lbs</div></div>
        <div class="center grow"><div class="xs muted">SETS</div><div class="bold" style="font-size:22px">${sets}</div></div>
      </div>
    </div>`;

  html += a.exercises.map((ex, xi) => {
    const meta = exById(ex.exId);
    const best = bestSetFor(ex.exId);
    return `<div class="card">
      <div class="row">
        <div class="grow">
          <span class="ex-name" onclick="showExDetail('${ex.exId}')">${esc(meta?.name || "?")}</span>
          ${best ? `<div class="xs muted mt8">Best: ${kg(best.weight)} lbs × ${best.reps}</div>` : ""}
        </div>
        <button class="btn small danger" onclick="removeExercise(${xi})">✕</button>
      </div>
      <div class="set-head">
        <div class="hdr">Set</div><div class="hdr">Previous</div><div class="hdr">lbs</div><div class="hdr">Reps</div><div class="hdr">✓</div>
      </div>
      ${(() => { let n = 0; return ex.sets.map((s, si) => `
        <div class="set-row ${s.done?'done':''}">
          <button class="set-num ${s.type==='W'?'warm':''}" title="Tap to toggle warmup"
                  onclick="cycleType(${xi},${si})">${s.type==='W' ? "W" : ++n}</button>
          <div class="prev">${s.prevW!=null ? `${kg(s.prevW)} lbs × ${s.prevR}` : "—"}</div>
          <input type="number" inputmode="decimal" step="0.5" placeholder="${s.prevW ?? ""}" value="${s.weight ?? ""}"
                 onchange="setField(${xi},${si},'weight',this.value)">
          <input type="number" inputmode="numeric" placeholder="${s.prevR ?? ""}" value="${s.reps ?? ""}"
                 onchange="setField(${xi},${si},'reps',this.value)">
          <button class="chk" onclick="toggleSet(${xi},${si})">${s.done?"✓":""}</button>
        </div>`).join(""); })()}
      <div class="row mt12">
        <button class="btn small ghost grow" onclick="addSet(${xi})">+ Add Set</button>
      </div>
    </div>`;
  }).join("");

  html += `<button class="btn ghost mt8" onclick="openExercisePicker(pickForWorkout)">+ Add Exercise</button>
           <button class="btn danger mt12" style="width:100%;margin-top:10px" onclick="cancelWorkout()">Discard Workout</button>`;
  main.innerHTML = html;

  const clock = $("#liveClock");
  const tick = () => { if (clock) clock.textContent = fmtClock(Date.now() - new Date(a.startedAt)); };
  tick();
  tickHandle = setInterval(tick, 1000);
}

function setField(xi, si, k, v){
  const s = db.active.exercises[xi].sets[si];
  s[k] = v === "" ? null : parseFloat(v);
  save();
}
function toggleSet(xi, si){
  const s = db.active.exercises[xi].sets[si];
  if (!s.done){
    if (s.weight == null && s.prevW != null) s.weight = s.prevW;
    if (s.reps == null && s.prevR != null) s.reps = s.prevR;
    s.done = true;
    startRest();
  } else s.done = false;
  save(); renderActiveWorkout();
}
function addSet(xi){
  const ex = db.active.exercises[xi];
  const last = ex.sets[ex.sets.length-1];
  ex.sets.push({type:"N", weight:null, reps:null, done:false, prevW:last?.prevW ?? null, prevR:last?.prevR ?? null});
  save(); renderActiveWorkout();
}
function cycleType(xi, si){
  const s = db.active.exercises[xi].sets[si];
  s.type = s.type === "W" ? "N" : "W";
  save(); renderActiveWorkout();
}
function removeExercise(xi){
  db.active.exercises.splice(xi,1);
  save(); renderActiveWorkout();
}
function pickForWorkout(exId){
  db.active.exercises.push(makeWorkoutExercise(exId));
  save(); closeModal(); renderActiveWorkout();
}
function cancelWorkout(){
  if (!confirm("Discard this workout? Nothing will be saved.")) return;
  db.active = null; stopRest(); save(); render();
}
function finishWorkout(){
  const a = db.active;
  const sets = doneSets(a);
  if (!sets){ alert("No completed sets yet — check off at least one set (✓) to finish."); return; }
  // record PRs vs history before this workout
  const prs = [];
  for (const ex of a.exercises){
    let top = null;
    for (const s of ex.sets) if (s.done && s.weight && s.type!=="W" && (!top || epley(s.weight,s.reps) > epley(top.weight,top.reps))) top = s;
    if (!top) continue;
    const prevBest = bestSetFor(ex.exId);
    if (!prevBest || epley(top.weight, top.reps) > epley(prevBest.weight, prevBest.reps))
      prs.push(exById(ex.exId)?.name);
  }
  const w = {
    id: a.id, name: a.name, startedAt: a.startedAt, endedAt: todayISO(),
    exercises: a.exercises
      .map(ex => ({exId: ex.exId, sets: ex.sets.filter(s=>s.done).map(({type,weight,reps,done})=>({type,weight,reps,done}))}))
      .filter(ex => ex.sets.length),
  };
  db.workouts.unshift(w);
  db.active = null;
  stopRest(); save();
  showSummary(w, prs);
}
function showSummary(w, prs){
  tab = "history"; renderNav();
  const dur = fmtDur(new Date(w.endedAt) - new Date(w.startedAt));
  openModal(`
    <h3>🎉 Workout Complete</h3>
    <div class="stat3">
      <div class="card"><div class="v">${dur}</div><div class="k">Duration</div></div>
      <div class="card"><div class="v">${kg(workoutVolume(w))}</div><div class="k">Volume (lbs)</div></div>
      <div class="card"><div class="v">${doneSets(w)}</div><div class="k">Sets</div></div>
    </div>
    ${prs.length ? `<div class="card"><div class="bold" style="color:var(--amber)">🏆 New PRs</div>
      <div class="sm mt8">${prs.map(esc).join("<br>")}</div></div>` : ""}
    <button class="btn" onclick="closeModal();render()">Done</button>
  `, () => render());
}

/* ============ rest timer ============ */
let restEnd = null, restHandle = null;
function startRest(){
  stopRest();
  restEnd = Date.now() + db.settings.restSec * 1000;
  const bar = document.createElement("div");
  bar.id = "restBar";
  bar.innerHTML = `
    <div class="time" id="restTime"></div>
    <div class="grow xs muted">Rest timer</div>
    <button onclick="bumpRest(-15)">-15</button>
    <button onclick="bumpRest(15)">+15</button>
    <button onclick="stopRest()">Skip</button>`;
  document.body.appendChild(bar);
  const tick = () => {
    const left = restEnd - Date.now();
    if (left <= 0){ stopRest(); if (navigator.vibrate) navigator.vibrate(200); return; }
    const t = $("#restTime"); if (t) t.textContent = fmtClock(left);
  };
  tick(); restHandle = setInterval(tick, 250);
}
function bumpRest(d){ restEnd += d*1000; }
function stopRest(){
  clearInterval(restHandle);
  $("#restBar")?.remove();
  restEnd = null;
}

/* ============ ROUTINES ============ */
function routineCard(r){
  const names = r.items.map(i => exById(i.exId)?.name).filter(Boolean);
  const nSets = r.items.reduce((t,i)=>t+i.sets.length,0);
  return `<div class="card">
    <div class="bold">${esc(r.name)}</div>
    <div class="sm muted mt8">${names.length} exercises · ${nSets} sets — ${esc(names.slice(0,5).join(", "))}${names.length>5?"…":""}</div>
    <div class="row mt12">
      <button class="btn small grow" onclick="startRoutine('${r.id}');go('workout')">Start</button>
      <button class="btn small ghost" onclick="editRoutine('${r.id}')">Edit</button>
      <button class="btn small danger" onclick="deleteRoutine('${r.id}')">Delete</button>
    </div>
  </div>`;
}
function renderRoutines(){
  setHeader("Routines", `${db.routines.length} routine${db.routines.length===1?"":"s"}`);
  let html = `<div class="row">
    <button class="btn grow" onclick="editRoutine(null)">+ New Routine</button>
    <button class="btn ghost" style="width:auto" onclick="newFolder()">+ Folder</button>
  </div>`;
  if (!db.routines.length && !db.folders.length){
    html += `<div class="empty"><span class="big">📋</span>Routines are reusable workout templates.<br>Create one so you can start training with one tap.<br>Use folders to group them (e.g. Push Pull Legs).</div>`;
  }
  for (const f of db.folders){
    const rs = db.routines.filter(r => r.folderId === f.id);
    html += `<h2 class="section" style="display:flex;align-items:center;gap:8px">📁 ${esc(f.name)}
      <span style="text-transform:none;font-weight:400">(${rs.length})</span>
      <span class="grow"></span>
      <button class="btn small danger" onclick="deleteFolder('${f.id}')">✕</button></h2>`;
    html += rs.map(routineCard).join("") || `<div class="sm muted" style="padding:0 2px 6px">Empty folder — assign routines to it in the routine editor.</div>`;
  }
  const loose = db.routines.filter(r => !r.folderId || !db.folders.find(f => f.id === r.folderId));
  if (loose.length && db.folders.length) html += `<h2 class="section">Ungrouped</h2>`;
  html += loose.map(routineCard).join("");
  main.innerHTML = html;
}
function newFolder(){
  const name = (prompt("Folder name (e.g. Push Pull Legs)") || "").trim();
  if (!name) return;
  db.folders.push({id: uid(), name});
  save(); renderRoutines();
}
function deleteFolder(fid){
  if (!confirm("Delete this folder? Routines inside are kept (moved to Ungrouped).")) return;
  db.folders = db.folders.filter(f => f.id !== fid);
  for (const r of db.routines) if (r.folderId === fid) r.folderId = null;
  save(); renderRoutines();
}

let draftRoutine = null;
function editRoutine(rid){
  const src = rid ? db.routines.find(r=>r.id===rid) : null;
  draftRoutine = src ? JSON.parse(JSON.stringify(src)) : {id:uid(), name:"", folderId:null, items:[]};
  renderRoutineEditor();
}
function renderRoutineEditor(){
  const r = draftRoutine;
  openModal(`
    <h3>${r.name ? "Edit Routine" : "New Routine"}</h3>
    <input type="text" id="rName" placeholder="Routine name (e.g. Push Day)" value="${esc(r.name)}"
           oninput="draftRoutine.name=this.value">
    ${db.folders.length ? `<select style="margin-top:8px" onchange="draftRoutine.folderId=this.value||null">
      <option value="">No folder</option>
      ${db.folders.map(f=>`<option value="${f.id}" ${r.folderId===f.id?"selected":""}>${esc(f.name)}</option>`).join("")}
    </select>` : ""}
    <div class="mt12">
      ${r.items.map((it, i) => `
        <div class="card" style="padding:12px">
          <div class="row">
            <div class="grow bold sm" style="color:var(--accent)">${esc(exById(it.exId)?.name || "?")}</div>
            <button class="btn small danger" onclick="draftRoutine.items.splice(${i},1);renderRoutineEditor()">✕</button>
          </div>
          <div class="rt-head"><div class="hdr">Set</div><div class="hdr">lbs</div><div class="hdr">Reps</div><div class="hdr"></div></div>
          ${(() => { let n = 0; return it.sets.map((s, si) => `
            <div class="rt-row">
              <button class="set-num ${s.type==='W'?'warm':''}" title="Tap to toggle warmup"
                      onclick="rCycle(${i},${si})">${s.type==='W' ? "W" : ++n}</button>
              <input type="number" inputmode="decimal" step="0.5" placeholder="lbs" value="${s.weight ?? ""}"
                     onchange="rSetField(${i},${si},'weight',this.value)">
              <input type="number" inputmode="numeric" placeholder="reps" value="${s.reps ?? ""}"
                     onchange="rSetField(${i},${si},'reps',this.value)">
              <button class="chk" onclick="rDelSet(${i},${si})">✕</button>
            </div>`).join(""); })()}
          <button class="btn small ghost mt8" style="width:100%" onclick="rAddSet(${i})">+ Add Set</button>
        </div>`).join("") || `<div class="empty sm">No exercises yet.</div>`}
    </div>
    <button class="btn ghost mt12" onclick="openExercisePicker(pickForRoutine)">+ Add Exercise</button>
    <button class="btn mt12" style="margin-top:10px" onclick="saveRoutine()">Save Routine</button>
  `);
}
function rSetField(i, si, k, v){ draftRoutine.items[i].sets[si][k] = v === "" ? null : parseFloat(v); }
function rCycle(i, si){ const s = draftRoutine.items[i].sets[si]; s.type = s.type === "W" ? "N" : "W"; renderRoutineEditor(); }
function rAddSet(i){
  const sets = draftRoutine.items[i].sets;
  const last = sets[sets.length-1];
  sets.push({type:"N", weight: last?.weight ?? null, reps: last?.reps ?? null});
  renderRoutineEditor();
}
function rDelSet(i, si){ draftRoutine.items[i].sets.splice(si,1); renderRoutineEditor(); }
function pickForRoutine(exId){
  const prev = lastSetsFor(exId);
  const mk = i => ({type:"N", weight: prev[i]?.weight ?? null, reps: prev[i]?.reps ?? null});
  draftRoutine.items.push({exId, sets:[mk(0), mk(1), mk(2)]});
  renderRoutineEditor();
}
function saveRoutine(){
  const r = draftRoutine;
  r.name = (r.name || "").trim() || "Untitled Routine";
  r.items = r.items.filter(it => it.sets.length);
  if (!r.items.length){ alert("Add at least one exercise."); return; }
  const i = db.routines.findIndex(x=>x.id===r.id);
  if (i >= 0) db.routines[i] = r; else db.routines.push(r);
  draftRoutine = null;
  save(); closeModal(); renderRoutines();
}
function deleteRoutine(rid){
  if (!confirm("Delete this routine? Past workouts are kept.")) return;
  db.routines = db.routines.filter(r=>r.id!==rid);
  save(); renderRoutines();
}

/* ============ HISTORY ============ */
function renderHistory(){
  const total = db.workouts.length;
  setHeader("History", total ? `${total} workout${total===1?"":"s"} logged` : "");
  if (!total){
    main.innerHTML = `<div class="empty"><span class="big">🕐</span>No workouts yet.<br>Finish your first workout and it will show up here.</div>`;
    return;
  }
  main.innerHTML = db.workouts.map(w => {
    const dur = fmtDur(new Date(w.endedAt) - new Date(w.startedAt));
    return `<div class="card" onclick="showWorkout('${w.id}')" style="cursor:pointer">
      <div class="row">
        <div class="grow">
          <div class="bold">${esc(w.name)}</div>
          <div class="xs muted mt8">${fmtDate(w.endedAt)} · ${dur} · ${kg(workoutVolume(w))} lbs · ${doneSets(w)} sets</div>
        </div>
        <span class="muted">›</span>
      </div>
      <div class="sm muted mt8">${w.exercises.map(ex => `${ex.sets.length}× ${esc(exById(ex.exId)?.name||"?")}`).join("<br>")}</div>
    </div>`;
  }).join("");
}
function showWorkout(id){
  const w = db.workouts.find(x=>x.id===id); if(!w) return;
  openModal(`
    <h3>${esc(w.name)}</h3>
    <div class="xs muted">${new Date(w.endedAt).toLocaleString()}</div>
    <div class="stat3">
      <div class="card"><div class="v">${fmtDur(new Date(w.endedAt)-new Date(w.startedAt))}</div><div class="k">Duration</div></div>
      <div class="card"><div class="v">${kg(workoutVolume(w))}</div><div class="k">Volume (lbs)</div></div>
      <div class="card"><div class="v">${doneSets(w)}</div><div class="k">Sets</div></div>
    </div>
    ${w.exercises.map(ex => `<div class="card">
      <div class="bold sm" style="color:var(--accent)">${esc(exById(ex.exId)?.name||"?")}</div>
      <div class="sm mt8">${(() => { let n = 0; return ex.sets.map(s =>
        `<div class="row" style="padding:3px 0"><span style="width:26px;${s.type==='W'?'color:var(--amber);font-weight:800':'color:var(--muted)'}">${s.type==='W' ? "W" : ++n}</span> ${kg(s.weight||0)} lbs × ${s.reps||0}</div>`).join(""); })()}</div>
    </div>`).join("")}
    <button class="btn ghost" onclick="repeatWorkout('${w.id}')">Repeat Workout</button>
    <button class="btn danger mt12" style="width:100%;margin-top:10px" onclick="deleteWorkout('${w.id}')">Delete</button>
  `);
}
function repeatWorkout(id){
  const w = db.workouts.find(x=>x.id===id); if(!w) return;
  if (db.active && !confirm("A workout is already in progress. Replace it?")) return;
  db.active = {
    id:uid(), name:w.name, startedAt:todayISO(),
    exercises: w.exercises.map(ex => makeWorkoutExercise(ex.exId, ex.sets)),
  };
  save(); closeModal(); go("workout");
}
function deleteWorkout(id){
  if (!confirm("Delete this workout from history?")) return;
  db.workouts = db.workouts.filter(w=>w.id!==id);
  save(); closeModal(); renderHistory();
}

/* ============ EXERCISES ============ */
const MUSCLES = ["All","Chest","Back","Legs","Glutes","Shoulders","Arms","Core"];
function renderExercises(){
  setHeader("Exercises", `${db.exercises.length} in library`,
    `<button class="btn small ghost" onclick="newExercise()">+ New</button>`);
  const q = exSearch.toLowerCase();
  const list = db.exercises
    .filter(e => (exFilter==="All" || e.muscle===exFilter) && e.name.toLowerCase().includes(q))
    .sort((a,b) => a.name.localeCompare(b.name));
  main.innerHTML = `
    <input type="search" placeholder="Search exercises…" value="${esc(exSearch)}"
           oninput="exSearch=this.value;renderExercises()" style="margin-bottom:10px">
    <div class="filters">${MUSCLES.map(m =>
      `<span class="pill ${m===exFilter?'on':''}" onclick="exFilter='${m}';renderExercises()">${m}</span>`).join("")}</div>
    <div class="card" style="padding:2px 12px">
      ${list.map(e => {
        const best = bestSetFor(e.id);
        return `<div class="lrow" onclick="showExDetail('${e.id}')">
          <div class="avatar">${esc(e.name[0])}</div>
          <div class="grow">
            <div class="bold sm">${esc(e.name)}</div>
            <div class="xs muted">${esc(e.muscle)} · ${esc(e.equipment)}</div>
          </div>
          ${best ? `<div class="xs muted">${kg(best.weight)} lbs × ${best.reps}</div>` : ""}
          <span class="muted">›</span>
        </div>`;
      }).join("") || `<div class="empty sm">No matches.</div>`}
    </div>`;
}
function newExercise(){
  openModal(`
    <h3>New Exercise</h3>
    <input type="text" id="neName" placeholder="Exercise name">
    <div class="row mt12">
      <select id="neMuscle">${MUSCLES.slice(1).map(m=>`<option>${m}</option>`).join("")}</select>
      <select id="neEquip">${["Barbell","Dumbbell","Machine","Cable","Bodyweight","Other"].map(m=>`<option>${m}</option>`).join("")}</select>
    </div>
    <button class="btn mt12" onclick="saveNewExercise()">Save</button>
  `);
}
function saveNewExercise(){
  const name = $("#neName").value.trim();
  if (!name){ alert("Name required."); return; }
  db.exercises.push({id:uid(), name, muscle:$("#neMuscle").value, equipment:$("#neEquip").value, custom:true});
  save(); closeModal(); renderExercises();
}
function showExDetail(exId){
  const e = exById(exId); if(!e) return;
  // gather per-session best
  const sessions = [];
  for (const w of [...db.workouts].reverse()){
    for (const ex of w.exercises){
      if (ex.exId !== exId) continue;
      let top = null, vol = 0;
      for (const s of ex.sets){ if (s.done && s.weight && s.type!=="W"){ vol += s.weight*(s.reps||0);
        if (!top || epley(s.weight,s.reps) > epley(top.weight,top.reps)) top = s; } }
      if (top) sessions.push({date:w.endedAt, top, vol});
    }
  }
  const best = bestSetFor(exId);
  openModal(`
    <h3>${esc(e.name)}</h3>
    <div class="xs muted">${esc(e.muscle)} · ${esc(e.equipment)}</div>
    ${best ? `<div class="stat3">
      <div class="card"><div class="v">${kg(best.weight)}</div><div class="k">Best lbs</div></div>
      <div class="card"><div class="v">${kg(epley(best.weight,best.reps))}</div><div class="k">Est. 1RM</div></div>
      <div class="card"><div class="v">${sessions.length}</div><div class="k">Sessions</div></div>
    </div>` : `<div class="empty sm">No logged sets yet.</div>`}
    ${sessions.length > 1 ? `<div class="chart-wrap">${chartSVG(sessions.map(s=>epley(s.top.weight,s.top.reps)))}<div class="xs muted center">Estimated 1RM over time</div></div>` : ""}
    ${sessions.length ? `<h2 class="section">Recent</h2>` + [...sessions].reverse().slice(0,8).map(s =>
      `<div class="lrow" style="cursor:default">
        <div class="grow sm">${fmtDate(s.date)}</div>
        <div class="sm bold">${kg(s.top.weight)} lbs × ${s.top.reps}</div>
        <div class="xs muted">${kg(s.vol)} lbs vol</div>
      </div>`).join("") : ""}
    ${e.custom ? `<button class="btn danger mt12" style="width:100%" onclick="archiveExercise('${e.id}')">Delete Exercise</button>` : ""}
  `);
}
function archiveExercise(id){
  if (!confirm("Delete this custom exercise? History referencing it is kept.")) return;
  db.exercises = db.exercises.filter(e=>e.id!==id);
  save(); closeModal(); renderExercises();
}
function chartSVG(vals){
  const W=460, H=110, P=10;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const pts = vals.map((v,i) => [
    P + i*(W-2*P)/Math.max(vals.length-1,1),
    H-P - (v-min)/span*(H-2*P)
  ]);
  const path = pts.map((p,i)=>`${i?"L":"M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join("")}
  </svg>`;
}

/* ============ exercise picker ============ */
let pickerCb = null, pickerSearch = "", pickerFilter = "All";
function openExercisePicker(cb){
  pickerCb = cb; pickerSearch=""; pickerFilter="All";
  renderPicker();
}
function renderPicker(){
  const q = pickerSearch.toLowerCase();
  const list = db.exercises
    .filter(e => (pickerFilter==="All" || e.muscle===pickerFilter) && e.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name));
  openModal(`
    <h3>Add Exercise</h3>
    <input type="search" placeholder="Search…" value="${esc(pickerSearch)}"
           oninput="pickerSearch=this.value;renderPicker()" autofocus>
    <div class="filters mt8">${MUSCLES.map(m =>
      `<span class="pill ${m===pickerFilter?'on':''}" onclick="pickerFilter='${m}';renderPicker()">${m}</span>`).join("")}</div>
    <div class="card" style="padding:2px 12px">
      ${list.map(e => `<div class="lrow" onclick="pickerCb('${e.id}')">
        <div class="avatar">${esc(e.name[0])}</div>
        <div class="grow">
          <div class="bold sm">${esc(e.name)}</div>
          <div class="xs muted">${esc(e.muscle)} · ${esc(e.equipment)}</div>
        </div>
      </div>`).join("") || `<div class="empty sm">No matches.</div>`}
    </div>
  `, null, true);
}

/* ============ modal ============ */
let modalOnClose = null;
function openModal(html, onClose, keepInput){
  let bg = $("#modalBg");
  if (!bg){
    bg = document.createElement("div");
    bg.id = "modalBg"; bg.className = "modal-bg";
    bg.addEventListener("click", e => { if (e.target === bg) closeModal(); });
    document.body.appendChild(bg);
  }
  modalOnClose = onClose || null;
  const prevScroll = bg.firstChild?.scrollTop || 0;
  bg.innerHTML = `<div class="modal"><div class="grab"></div>${html}</div>`;
  if (keepInput){
    const inp = bg.querySelector("input[type=search]");
    if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    bg.firstChild.scrollTop = prevScroll;
  }
}
function closeModal(){
  $("#modalBg")?.remove();
  const cb = modalOnClose; modalOnClose = null;
  if (cb) cb();
}

render();
</script>
</body>
